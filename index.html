<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Washing Machine</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #controls {
      position: fixed; z-index: 999; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 10px;
      flex-wrap: wrap; justify-content: center; width: 95%;
    }
    button {
      border: none; border-radius: 12px; padding: 14px 18px;
      font-size: 16px; font-weight: bold; background: rgba(20,20,20,.85);
      color: white; cursor: pointer;
    }
    button:active { transform: scale(.95); }
    #speedText {
      position: fixed; z-index: 999; top: 20px; left: 50%;
      transform: translateX(-50%); background: rgba(0,0,0,.7);
      color: white; padding: 10px 18px; border-radius: 10px; font-size: 18px;
    }
  </style>
</head>

<body>
  <div id="speedText">ความเร็วถัง: <span id="speedValue">0</span></div>

  <div id="controls">
    <button onclick="setSpeed(0)">หยุด</button>
    <button onclick="setSpeed(1)">ช้า</button>
    <button onclick="setSpeed(2)">กลาง</button>
    <button onclick="setSpeed(4)">เร็ว</button>
    <button onclick="toggleDoor()">เปิด/ปิดฝา</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-light type="ambient" color="#ffffff" intensity="2"></a-light>
    <a-light type="directional" position="2 4 3" intensity="3"></a-light>

    <a-marker preset="hiro" id="hiroMarker">

      <a-entity id="washingMachine">

        <!-- ตัวเครื่อง -->
        <a-box position="0 0.8 0" width="1.6" height="1.6" depth="1.1" color="#e8e8e8"></a-box>

        <!-- แผงด้านบน -->
        <a-box position="0 1.63 -0.01" width="1.55" height="0.08" depth="1.05" color="#d0d0d0"></a-box>

        <!-- แผงควบคุม -->
        <a-box position="0 1.25 -0.57" width="1.4" height="0.3" depth="0.08" color="#222222"></a-box>

        <!-- ปุ่มหมุน -->
        <a-cylinder position="-0.45 1.25 -0.63" radius="0.1" height="0.04"
                     rotation="90 0 0" color="#ffffff"></a-cylinder>

        <!-- หน้าจอ -->
        <a-box position="0.35 1.25 -0.63" width="0.35" height="0.13"
               depth="0.03" color="#39d5ff"></a-box>

        <!-- ถังซัก -->
        <a-entity id="drum" position="0 0.72 -0.58">
          <a-torus radius="0.47" radius-tubular="0.08"
                   rotation="90 0 0" color="#555555"></a-torus>
          <a-circle radius="0.39" rotation="90 0 0" color="#222222"></a-circle>

          <a-box position="0 0 0.02" width="0.08" height="0.7" depth="0.04"
                 rotation="0 0 45" color="#777777"></a-box>
          <a-box position="0 0 0.02" width="0.08" height="0.7" depth="0.04"
                 rotation="0 0 -45" color="#777777"></a-box>
        </a-entity>

        <!-- ฝา -->
        <a-entity id="door" position="0 0.72 -0.68">
          <a-torus radius="0.52" radius-tubular="0.06"
                   rotation="90 0 0" color="#cccccc"></a-torus>
          <a-circle radius="0.45" rotation="90 0 0"
                    color="#4d6f7d" opacity="0.75"></a-circle>
        </a-entity>

        <!-- ฐาน -->
        <a-box position="0 0.03 0" width="1.65" height="0.1"
               depth="1.15" color="#bbbbbb"></a-box>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const drum = document.querySelector("#drum");
    const door = document.querySelector("#door");
    const speedValue = document.querySelector("#speedValue");

    let speed = 0;
    let doorOpen = false;
    let drumRotation = 0;
    let lastTime = performance.now();

    function setSpeed(value) {
      speed = value;
      speedValue.textContent = value;
    }

    function toggleDoor() {
      doorOpen = !doorOpen;

      door.setAttribute("animation",
        "property: rotation; " +
        "to: " + (doorOpen ? "-70 0 0" : "0 0 0") + "; " +
        "dur: 600; easing: easeOutQuad"
      );
    }

    function animateDrum(time) {
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      if (speed > 0 && !doorOpen) {
        drumRotation += speed * 180 * delta;
        drum.setAttribute("rotation", `0 0 ${drumRotation}`);
      }

      requestAnimationFrame(animateDrum);
    }

    requestAnimationFrame(animateDrum);
  </script>
</body>
</html>
