<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Snake - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.7);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 7px 14px;
      border-radius: 10px;
    }

    #controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 95%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 17px;
      color: white;
      background: rgba(25,25,25,.9);
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }

    button:active {
      transform: scale(.94);
    }

    #bite { background: #b71c1c; }
    #poison { background: #6a1b9a; }
    #saw { background: #455a64; }
    #reset { background: #1565c0; }
  </style>
</head>

<body>

  <div id="title">🐍 AR SNAKE</div>
  <div id="status">ส่องกล้องไปที่ Hiro Marker</div>

  <div id="controls">
    <button id="bite" onclick="snakeBite()">🐍 กัด</button>
    <button id="poison" onclick="shootPoison()">☠️ พ่นพิษ</button>
    <button id="saw" onclick="sawAttack()">⚙️ เลื่อย</button>
    <button id="reset" onclick="resetSnake()">↩️ รีเซ็ต</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-light type="ambient" color="#ffffff" intensity="2"></a-light>
    <a-light type="directional" position="2 4 3" intensity="2"></a-light>

    <!-- Hiro Marker -->
    <a-marker preset="hiro" id="hiroMarker">

      <!-- งู -->
      <a-entity id="snake">

        <!-- ลำตัวงู -->
        <a-entity id="body">
          <a-cylinder position="0 0.30 0"
                      radius="0.16"
                      height="0.9"
                      color="#2e7d32"
                      rotation="0 0 90">
          </a-cylinder>

          <a-cylinder position="0.42 0.30 0"
                      radius="0.14"
                      height="0.65"
                      color="#388e3c"
                      rotation="0 0 90">
          </a-cylinder>

          <a-cylinder position="-0.42 0.30 0"
                      radius="0.14"
                      height="0.65"
                      color="#388e3c"
                      rotation="0 0 90">
          </a-cylinder>
        </a-entity>

        <!-- หัว -->
        <a-sphere id="head"
                  position="0 0.30 -0.62"
                  radius="0.25"
                  color="#43a047">
        </a-sphere>

        <!-- ตา -->
        <a-sphere position="-0.12 0.43 -0.80"
                  radius="0.045"
                  color="#ffffff"></a-sphere>
        <a-sphere position="0.12 0.43 -0.80"
                  radius="0.045"
                  color="#ffffff"></a-sphere>

        <a-sphere position="-0.12 0.43 -0.835"
                  radius="0.018"
                  color="#111111"></a-sphere>
        <a-sphere position="0.12 0.43 -0.835"
                  radius="0.018"
                  color="#111111"></a-sphere>

        <!-- ปาก -->
        <a-box id="mouth"
               position="0 0.25 -0.84"
               width="0.20"
               height="0.035"
               depth="0.02"
               color="#111111">
        </a-box>

        <!-- เขี้ยวแบบการ์ตูน -->
        <a-cone id="fangLeft"
                position="-0.06 0.18 -0.86"
                radius-bottom="0.025"
                radius-top="0"
                height="0.12"
                color="#ffffff">
        </a-cone>

        <a-cone id="fangRight"
                position="0.06 0.18 -0.86"
                radius-bottom="0.025"
                radius-top="0"
                height="0.12"
                color="#ffffff">
        </a-cone>

        <!-- ลิ้น -->
        <a-box id="tongue"
               position="0 0.29 -0.90"
               width="0.035"
               height="0.015"
               depth="0.22"
               color="#e91e63">
        </a-box>

        <!-- เอฟเฟกต์พิษ -->
        <a-entity id="poisonEffect" visible="false">
          <a-sphere position="0 0.30 -1.0"
                    radius="0.08"
                    color="#ce93d8"
                    opacity="0.8">
          </a-sphere>
          <a-sphere position="0 0.30 -1.18"
                    radius="0.06"
                    color="#ab47bc"
                    opacity="0.7">
          </a-sphere>
          <a-sphere position="0 0.30 -1.34"
                    radius="0.04"
                    color="#7b1fa2"
                    opacity="0.6">
          </a-sphere>
        </a-entity>

        <!-- เอฟเฟกต์เลื่อยแบบการ์ตูน -->
        <a-entity id="sawEffect" visible="false">
          <a-torus position="0 0.30 -0.95"
                   radius="0.18"
                   radius-tubular="0.035"
                   color="#b0bec5"
                   rotation="90 0 0">
          </a-torus>
          <a-torus position="0 0.30 -0.95"
                   radius="0.12"
                   radius-tubular="0.025"
                   color="#eceff1"
                   rotation="90 0 0">
          </a-torus>
        </a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const snake = document.querySelector("#snake");
    const head = document.querySelector("#head");
    const poisonEffect = document.querySelector("#poisonEffect");
    const sawEffect = document.querySelector("#sawEffect");
    const status = document.querySelector("#status");

    function animate(target, property, from, to, duration = 350) {
      target.setAttribute("animation", {
        property: property,
        from: from,
        to: to,
        dur: duration,
        easing: "easeOutBack"
      });
    }

    function snakeBite() {
      status.textContent = "🐍 งูกำลังกัด!";
      animate(head, "position", "0 0.30 -0.62", "0 0.30 -0.95", 180);

      setTimeout(() => {
        animate(head, "position", "0 0.30 -0.95", "0 0.30 -0.62", 250);
      }, 220);
    }

    function shootPoison() {
      status.textContent = "☠️ เอฟเฟกต์พิษ!";
      poisonEffect.setAttribute("visible", true);

      poisonEffect.setAttribute("animation__scale", {
        property: "scale",
        from: "0.2 0.2 0.2",
        to: "1.5 1.5 1.5",
        dur: 450,
        easing: "easeOutQuad"
      });

      setTimeout(() => {
        poisonEffect.setAttribute("visible", false);
      }, 700);
    }

    function sawAttack() {
      status.textContent = "⚙️ เอฟเฟกต์เลื่อย!";
      sawEffect.setAttribute("visible", true);

      sawEffect.setAttribute("animation__spin", {
        property: "rotation",
        from: "0 0 0",
        to: "0 0 360",
        dur: 500,
        easing: "linear"
      });

      setTimeout(() => {
        sawEffect.setAttribute("visible", false);
      }, 700);
    }

    function resetSnake() {
      poisonEffect.setAttribute("visible", false);
      sawEffect.setAttribute("visible", false);
      head.setAttribute("position", "0 0.30 -0.62");
      status.textContent = "พร้อมเล่น — ส่อง Hiro Marker";
    }
  </script>

</body>
</html>
